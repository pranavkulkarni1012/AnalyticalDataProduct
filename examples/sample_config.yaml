# configs/monthly_revenue_by_category.yaml
# Monthly Revenue by Product Category -- Analytical Data Product Pipeline Config
#
# This config is consumed by the generic pipeline (Glue/EMR/Lambda/ECS).
# All transformation logic lives in the SQL query below -- the pipeline code
# simply connects to Snowflake, executes the query, and writes the result
# to the Iceberg target. No transformation logic in pipeline code.

product:
  name: monthly_revenue_by_category
  domain: sales_analytics
  owner: sales-analytics-team@company.com
  version: "1.0.0"
  description: >
    Joins customer_orders and product_catalog from Snowflake,
    aggregates monthly revenue by product category, and writes
    to an Iceberg table for downstream consumption.
  tags:
    cost_center: "CC-1234"
    data_classification: "internal"
    compliance: "SOX"
  schedule:
    frequency: daily
    cron: "0 6 * * *"  # 6 AM UTC daily

# Compute engine selection (glue | emr | lambda | ecs)
compute:
  engine: glue          # PySpark on AWS Glue
  language: pyspark     # auto-derived from engine

# -- Snowflake Connection ------------------------------------------------
# Only connection-level settings are needed here. The SQL query below
# references tables using fully-qualified names (DATABASE.SCHEMA.TABLE).
source:
  type: snowflake
  connection:
    account: company-prod.us-east-1
    warehouse: ANALYTICS_WH
    role: ADP_READER_ROLE
    authenticator: oauth
    proxy:
      http_proxy: "http://corporate-proxy.company.com:8080"
      https_proxy: "http://corporate-proxy.company.com:8080"

# -- SQL Query (All Transformation Logic) --------------------------------
# The query contains ALL transformation logic: filtering, joins, aggregations,
# column mappings. Uses CTEs for intermediate steps. No temp tables.
# The generic pipeline executes this SQL against Snowflake, fetches the
# result set, and writes it directly to the Iceberg target.
query:
  sql: |
    WITH completed_orders AS (
        SELECT
            o."order_id",
            o."product_id",
            o."order_date",
            o."quantity",
            o."unit_price",
            o."total_amount"
        FROM "PROD_DB"."SALES"."CUSTOMER_ORDERS" o
        WHERE o."order_status" = 'COMPLETED'
          AND o."order_date" >= DATEADD(month, -13, CURRENT_DATE())
    ),
    enriched_orders AS (
        SELECT
            co."order_id",
            co."order_date",
            co."quantity",
            co."total_amount",
            p."category",
            p."product_name",
            p."subcategory",
            p."brand"
        FROM completed_orders co
        INNER JOIN "PROD_DB"."PRODUCTS"."PRODUCT_CATALOG" p
            ON co."product_id" = p."product_id"
    )
    SELECT
        eo."category"                              AS product_category,
        DATE_TRUNC('month', eo."order_date")       AS revenue_month,
        SUM(eo."total_amount")                     AS total_revenue,
        COUNT(DISTINCT eo."order_id")              AS order_count,
        AVG(eo."total_amount")                     AS avg_order_value,
        SUM(eo."quantity")                         AS total_units_sold
    FROM enriched_orders eo
    GROUP BY
        eo."category",
        DATE_TRUNC('month', eo."order_date")
    HAVING SUM(eo."total_amount") > 0
  description: >
    Joins customer_orders (filtered to completed, last 13 months) with
    product_catalog, then aggregates monthly revenue metrics by product category.

# -- Target ---------------------------------------------------------------

target:
  catalog: glue_catalog
  database: sales_analytics_monthly_revenue_prod
  table: monthly_revenue_by_category
  s3_path: "s3://sales-analytics-adp-prod/sales_analytics/monthly_revenue_by_category/data/"
  format: iceberg
  write_mode: overwrite
  partition_by:
    - revenue_month
  sort_order:
    - product_category
  table_properties:
    format-version: "2"
    write.format.default: parquet
    write.parquet.compression-codec: zstd
    write.metadata.delete-after-commit.enabled: "true"
    write.metadata.previous-versions-max: "10"

# -- Reconciliation -------------------------------------------------------

reconciliation:
  enabled: true
  rules:
    - name: total_revenue_check
      type: sum
      source_expr: >
        SELECT SUM("total_amount") FROM "PROD_DB"."SALES"."CUSTOMER_ORDERS"
        WHERE "order_status" = 'COMPLETED'
        AND "order_date" >= DATEADD(month, -13, CURRENT_DATE())
      target_expr: >
        SELECT SUM(total_revenue)
        FROM sales_analytics_monthly_revenue_prod.monthly_revenue_by_category
      tolerance_pct: 0.01

    - name: row_count_reasonableness
      type: row_count
      source_expr: >
        SELECT COUNT(DISTINCT DATE_TRUNC('month', o."order_date") || '-' || p."category")
        FROM "PROD_DB"."SALES"."CUSTOMER_ORDERS" o
        INNER JOIN "PROD_DB"."PRODUCTS"."PRODUCT_CATALOG" p ON o."product_id" = p."product_id"
        WHERE o."order_status" = 'COMPLETED'
        AND o."order_date" >= DATEADD(month, -13, CURRENT_DATE())
      target_expr: >
        SELECT COUNT(*)
        FROM sales_analytics_monthly_revenue_prod.monthly_revenue_by_category
      tolerance_pct: 0.0

    - name: no_null_categories
      type: null_check
      source_expr: "N/A"
      target_expr: >
        SELECT COUNT(*) FROM sales_analytics_monthly_revenue_prod.monthly_revenue_by_category
        WHERE product_category IS NULL
      tolerance_pct: 0.0

# -- Data Quality ---------------------------------------------------------

data_quality:
  checks:
    - name: revenue_positive
      type: range
      column: total_revenue
      parameters:
        min: 0
    - name: category_not_null
      type: not_null
      column: product_category
    - name: month_not_null
      type: not_null
      column: revenue_month
    - name: order_count_positive
      type: range
      column: order_count
      parameters:
        min: 1

# -- Runtime (Glue-specific) -----------------------------------------------

runtime:
  glue_version: "4.0"
  worker_type: G.2X
  num_workers: 10
  timeout_minutes: 120
  max_concurrent_runs: 1
  extra_py_files:
    - "s3://sales-analytics-adp-prod/libs/adp_common-1.0.0-py3-none-any.whl"
  extra_jars:
    - "s3://sales-analytics-adp-prod/jars/iceberg-spark-runtime-3.3_2.12-1.4.2.jar"
  job_parameters:
    "--conf spark.sql.catalog.glue_catalog": "org.apache.iceberg.spark.SparkCatalog"
    "--conf spark.sql.catalog.glue_catalog.warehouse": "s3://sales-analytics-adp-prod/sales_analytics/"
    "--conf spark.sql.catalog.glue_catalog.catalog-impl": "org.apache.iceberg.aws.glue.GlueCatalog"
    "--conf spark.sql.catalog.glue_catalog.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
  tags:
    environment: prod
    team: sales-analytics
    cost_center: "CC-1234"
