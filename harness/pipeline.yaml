# ─────────────────────────────────────────────────────────────────────────────
# Harness CD Pipeline for Analytical Data Products
# 3-stage deployment: DEV (auto) -> STAGING (approval) -> PROD (dual approval)
# ─────────────────────────────────────────────────────────────────────────────

pipeline:
  name: "ADP Deploy"
  identifier: "adp_deploy"
  projectIdentifier: "analytical_data_products"
  orgIdentifier: "data_platform"

  properties:
    ci:
      codebase:
        connectorRef: "github_connector"
        repoName: "AnalyticalDataProduct"
        build:
          type: branch

  variables:
    - name: product_name
      type: String
      description: "Analytical Data Product name"
      required: true
    - name: jira_ticket
      type: String
      description: "Jira ticket key for deployment tracking"
      required: true
    - name: artifact_path
      type: String
      description: "S3 path to build artifacts"
      required: true
    - name: artifact_version
      type: String
      description: "Build number / artifact version"
      required: true

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Deploy to DEV (auto-deploy, no approval)
  # ═══════════════════════════════════════════════════════════════════════════
  stages:
    - stage:
        name: "Deploy to DEV"
        identifier: "deploy_dev"
        type: Deployment
        spec:
          deploymentType: CustomDeployment
          environment:
            environmentRef: "dev"
            infrastructureDefinitions:
              - identifier: "aws_dev"
          execution:
            steps:
              # ── Terraform Apply ────────────────────────────────────────────
              - step:
                  name: "Terraform Apply (DEV)"
                  identifier: "tf_apply_dev"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/dev
                          terraform init \
                            -backend-config=backend-dev.hcl \
                            -input=false \
                            -reconfigure
                          terraform apply \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -auto-approve \
                            -input=false

              # ── Upload Scripts to S3 ───────────────────────────────────────
              - step:
                  name: "Upload Scripts to S3"
                  identifier: "upload_scripts_dev"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          aws s3 sync \
                            <+pipeline.variables.artifact_path>/scripts/ \
                            s3://adp-artifacts-dev/scripts/<+pipeline.variables.product_name>/ \
                            --region us-east-1

              # ── Trigger Step Function ──────────────────────────────────────
              - step:
                  name: "Trigger Test Execution"
                  identifier: "trigger_sfn_dev"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          EXECUTION_ARN=$(aws stepfunctions start-execution \
                            --state-machine-arn "arn:aws:states:us-east-1:$(aws sts get-caller-identity --query Account --output text):stateMachine:adp-*-<+pipeline.variables.product_name>-dev" \
                            --input '{}' \
                            --query 'executionArn' \
                            --output text \
                            --region us-east-1)
                          echo "Started execution: ${EXECUTION_ARN}"
                          export EXECUTION_ARN

              # ── Integration Test ───────────────────────────────────────────
              - step:
                  name: "Integration Test"
                  identifier: "integration_test_dev"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/wait_for_execution.py \
                            --product <+pipeline.variables.product_name> \
                            --env dev \
                            --timeout 600

              # ── Post Validation to Jira ────────────────────────────────────
              - step:
                  name: "Report to Jira (DEV)"
                  identifier: "jira_report_dev"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/post_jira_comment.py \
                            --ticket <+pipeline.variables.jira_ticket> \
                            --environment dev \
                            --status "SUCCESS" \
                            --artifact-version <+pipeline.variables.artifact_version> \
                            --summary "DEV deployment and integration test passed. Ready for STAGING promotion."

            rollbackSteps:
              - step:
                  name: "Rollback DEV"
                  identifier: "rollback_dev"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/dev
                          terraform init \
                            -backend-config=backend-dev.hcl \
                            -input=false \
                            -reconfigure
                          # Rollback: re-apply using the previous artifact version's plan
                          # NOTE: -refresh-only only syncs state, it does NOT revert resources.
                          # For a true rollback, re-deploy the previous artifact version.
                          terraform plan \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -input=false \
                            -out=rollback.tfplan
                          terraform apply -auto-approve -input=false rollback.tfplan

    # ═══════════════════════════════════════════════════════════════════════════
    # STAGE 2: Deploy to STAGING (lead-engineer approval, 24h timeout)
    # ═══════════════════════════════════════════════════════════════════════════
    - stage:
        name: "Deploy to STAGING"
        identifier: "deploy_staging"
        type: Deployment
        spec:
          deploymentType: CustomDeployment
          environment:
            environmentRef: "staging"
            infrastructureDefinitions:
              - identifier: "aws_staging"
          execution:
            steps:
              # ── Approval Gate ──────────────────────────────────────────────
              - step:
                  name: "Staging Approval"
                  identifier: "staging_approval"
                  type: HarnessApproval
                  timeout: 24h
                  spec:
                    approvalMessage: |
                      DEV deployment for <+pipeline.variables.product_name> succeeded.
                      Artifact version: <+pipeline.variables.artifact_version>
                      Please review and approve promotion to STAGING.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - "lead_engineers"
                      minimumCount: 1
                    approverInputs: []

              # ── Terraform Apply ────────────────────────────────────────────
              - step:
                  name: "Terraform Apply (STAGING)"
                  identifier: "tf_apply_staging"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/staging
                          terraform init \
                            -backend-config=backend-staging.hcl \
                            -input=false \
                            -reconfigure
                          terraform apply \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -auto-approve \
                            -input=false

              # ── Upload Scripts ─────────────────────────────────────────────
              - step:
                  name: "Upload Scripts to S3"
                  identifier: "upload_scripts_staging"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          aws s3 sync \
                            <+pipeline.variables.artifact_path>/scripts/ \
                            s3://adp-artifacts-staging/scripts/<+pipeline.variables.product_name>/ \
                            --region us-east-1

              # ── Run Reconciliation ─────────────────────────────────────────
              - step:
                  name: "Run Reconciliation"
                  identifier: "recon_staging"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/run_recon.py \
                            --product <+pipeline.variables.product_name> \
                            --env staging

              # ── Post Validation to Jira ────────────────────────────────────
              - step:
                  name: "Report to Jira (STAGING)"
                  identifier: "jira_report_staging"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/post_jira_comment.py \
                            --ticket <+pipeline.variables.jira_ticket> \
                            --environment staging \
                            --status "SUCCESS" \
                            --artifact-version <+pipeline.variables.artifact_version> \
                            --summary "STAGING deployment and reconciliation passed. Ready for PROD promotion."

            rollbackSteps:
              - step:
                  name: "Rollback STAGING"
                  identifier: "rollback_staging"
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/staging
                          terraform init \
                            -backend-config=backend-staging.hcl \
                            -input=false \
                            -reconfigure
                          # Rollback: re-apply using the previous artifact version's plan
                          # NOTE: -refresh-only only syncs state, it does NOT revert resources.
                          # For a true rollback, re-deploy the previous artifact version.
                          terraform plan \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -input=false \
                            -out=rollback.tfplan
                          terraform apply -auto-approve -input=false rollback.tfplan

    # ═══════════════════════════════════════════════════════════════════════════
    # STAGE 3: Deploy to PROD (dual approval, 48h timeout)
    # ═══════════════════════════════════════════════════════════════════════════
    - stage:
        name: "Deploy to PROD"
        identifier: "deploy_prod"
        type: Deployment
        spec:
          deploymentType: CustomDeployment
          environment:
            environmentRef: "prod"
            infrastructureDefinitions:
              - identifier: "aws_prod"
          execution:
            steps:
              # ── Dual Approval Gate ─────────────────────────────────────────
              - step:
                  name: "Production Approval"
                  identifier: "prod_approval"
                  type: HarnessApproval
                  timeout: 48h
                  spec:
                    approvalMessage: |
                      STAGING deployment for <+pipeline.variables.product_name> succeeded.
                      Reconciliation checks passed. Artifact version: <+pipeline.variables.artifact_version>
                      Both data-platform-lead AND product-owner must approve for PROD deployment.
                    includePipelineExecutionHistory: true
                    disallowPipelineExecutor: true
                    approvers:
                      userGroups:
                        - "data_platform_leads"
                        - "product_owners"
                      minimumCount: 2
                    approverInputs: []

              # ── Terraform Apply ────────────────────────────────────────────
              - step:
                  name: "Terraform Apply (PROD)"
                  identifier: "tf_apply_prod"
                  type: ShellScript
                  timeout: 20m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/prod
                          terraform init \
                            -backend-config=backend-prod.hcl \
                            -input=false \
                            -reconfigure
                          terraform apply \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -auto-approve \
                            -input=false

              # ── Upload Scripts ─────────────────────────────────────────────
              - step:
                  name: "Upload Scripts to S3"
                  identifier: "upload_scripts_prod"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          aws s3 sync \
                            <+pipeline.variables.artifact_path>/scripts/ \
                            s3://adp-artifacts-prod/scripts/<+pipeline.variables.product_name>/ \
                            --region us-east-1

              # ── Smoke Test ─────────────────────────────────────────────────
              - step:
                  name: "Smoke Test"
                  identifier: "smoke_test_prod"
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/smoke_test.py \
                            --product <+pipeline.variables.product_name> \
                            --env prod

              # ── Post Validation to Jira ────────────────────────────────────
              - step:
                  name: "Report to Jira (PROD)"
                  identifier: "jira_report_prod"
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          python scripts/post_jira_comment.py \
                            --ticket <+pipeline.variables.jira_ticket> \
                            --environment prod \
                            --status "SUCCESS" \
                            --artifact-version <+pipeline.variables.artifact_version> \
                            --summary "PROD deployment and smoke test passed. Deployment complete."

            rollbackSteps:
              - step:
                  name: "Rollback PROD"
                  identifier: "rollback_prod"
                  type: ShellScript
                  timeout: 20m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          cd terraform/environments/prod
                          terraform init \
                            -backend-config=backend-prod.hcl \
                            -input=false \
                            -reconfigure
                          # Rollback: re-apply using the previous artifact version's plan
                          # NOTE: -refresh-only only syncs state, it does NOT revert resources.
                          # For a true rollback, re-deploy the previous artifact version.
                          terraform plan \
                            -var="product_name=<+pipeline.variables.product_name>" \
                            -input=false \
                            -out=rollback.tfplan
                          terraform apply -auto-approve -input=false rollback.tfplan

                          # Post failure to Jira
                          python scripts/post_jira_comment.py \
                            --ticket <+pipeline.variables.jira_ticket> \
                            --environment prod \
                            --status "FAILED - ROLLED BACK" \
                            --artifact-version <+pipeline.variables.artifact_version> \
                            --summary "PROD deployment failed. Rollback executed."
